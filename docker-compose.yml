services:
  api:
    build: ./api
    ports:
      - "5001:5001"
    volumes:
      - ./api:/app
    environment:
      DB_HOST: db
      DB_NAME: tinycloud
      DB_USER: tinycloud
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tinycloud
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: tinycloud
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: